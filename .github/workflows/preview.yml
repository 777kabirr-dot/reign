name: Deploy Reign preview to GitHub Pages

# This repo serves Pages from the `gh-pages` branch (the Actions-environment
# deploy is blocked here), so we build the demo frontend and publish dist to
# that branch.

on:
  push:
    branches: [claude/trusting-tesla-tjx15q]
    paths:
      - "frontend/**"
      - ".github/workflows/preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build (demo mode, /reign/ base)
        working-directory: frontend
        env:
          VITE_DEMO: "1"
          VITE_BASE: "/reign/"
        run: npm run build

      - name: Publish to gh-pages
        working-directory: frontend/dist
        run: |
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Reign preview ${GITHUB_SHA}"
          git branch -M gh-pages
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
